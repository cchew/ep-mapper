[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ep-mapper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40.0",
  "pydantic>=2.0",
  "pdfplumber>=0.11",
  "lxml>=5.3",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
